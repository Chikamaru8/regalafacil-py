<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Express PY</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#14171c; --muted:#5c6573; --primary:#0f766e; --primary-ink:#fff; --accent:#d97706; --border:#e5e7eb; --radius:14px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:88px; line-height:1.45; }
    header { position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:12px 16px; }
    .wrap { max-width:960px; margin:0 auto; }
    .top-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-weight:800; font-size:1.1rem; color:var(--primary); }
    .seller-pill { font-size:0.78rem; background:#ecfdf5; color:var(--primary); border:1px solid #99f6e4; padding:4px 10px; border-radius:999px; font-weight:600; }
    .search-box { margin-top:10px; }
    input, select, button { font-family:inherit; font-size:0.92rem; border-radius:10px; }
    input[type="search"], input[type="text"], input[type="tel"], select { width:100%; padding:10px 12px; border:1px solid var(--border); background:#fff; color:var(--text); }
    .selector-card { margin:14px auto; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
    .selector-title { font-weight:700; font-size:0.98rem; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
    .filters-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
    .cats { display:flex; gap:8px; overflow-x:auto; padding:6px 0 12px; scrollbar-width:none; }
    .cats::-webkit-scrollbar { display:none; }
    .chip { white-space:nowrap; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer; font-size:0.85rem; font-weight:600; }
    .chip.active { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; }
    .thumb { aspect-ratio:4/3; background:#eef2f6; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:0.85rem; position:relative; }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .badge-offer { position:absolute; top:8px; left:8px; background:var(--accent); color:#fff; font-size:0.75rem; font-weight:700; padding:3px 8px; border-radius:999px; }
    .card-body { padding:12px; }
    .prod-name { font-weight:700; font-size:0.98rem; margin-bottom:4px; }
    .prod-desc { font-size:0.82rem; color:var(--muted); margin-bottom:10px; }
    .price-row { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
    .price { font-weight:800; font-size:1rem; color:var(--primary); }
    .price-old { font-size:0.82rem; color:var(--muted); text-decoration:line-through; }
    .btn { width:100%; padding:9px 12px; border:none; cursor:pointer; font-weight:700; background:var(--primary); color:var(--primary-ink); }
    .btn-ghost { background:transparent; color:var(--primary); border:1px solid var(--primary); padding:5px 10px; font-size:0.8rem; width:auto; }
    .cart-bar { position:fixed; bottom:0; left:0; right:0; background:#111827; color:#fff; padding:12px 16px; z-index:30; display:none; }
    .cart-bar.visible { display:block; }
    .cart-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-end; justify-content:center; z-index:40; }
    .modal-backdrop.open { display:flex; }
    .modal { background:#fff; width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px; max-height:85vh; overflow-y:auto; }
    .cart-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); gap:8px; }
    .empty { background:var(--card); border:1px dashed var(--border); border-radius:var(--radius); padding:28px 16px; text-align:center; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="top-bar">
        <div class="brand" id="brandName">Catálogo Express PY</div>
        <div class="seller-pill" id="sellerPill">Cargando...</div>
      </div>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Buscar producto o idea de regalo..." />
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="selector-card">
      <div class="selector-title">
        <span>¿Buscás un regalo? Filtrá rápido</span>
        <button class="btn btn-ghost" id="clearFiltersBtn" type="button">Limpiar</button>
      </div>
      <div class="filters-grid">
        <select id="budgetSelect"><option value="">Cualquier presupuesto</option></select>
        <select id="recipientSelect"><option value="">¿Para quién?</option></select>
        <select id="occasionSelect"><option value="">¿Qué ocasión?</option></select>
        <select id="ageSelect"><option value="">Edad</option></select>
      </div>
    </section>

    <div class="cats" id="categoryChips"></div>
    <div class="grid" id="productsGrid"><div class="empty">Cargando catálogo...</div></div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="cart-inner">
      <div><strong id="cartCount">0 productos</strong> · <span id="cartTotal">Gs. 0</span></div>
      <button class="btn" style="width:auto; padding:9px 16px;" id="openCheckoutBtn" type="button">Pedir por WhatsApp</button>
    </div>
  </div>

  <div class="modal-backdrop" id="checkoutModal">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3>Tu pedido / consulta</h3>
        <button class="btn btn-ghost" id="closeModalBtn" type="button">Cerrar</button>
      </div>
      <div id="cartItemsList"></div>
      <div style="margin-top:12px; display:grid; gap:8px;">
        <input type="text" id="customerName" placeholder="Tu nombre (opcional)" />
        <input type="tel" id="customerPhone" placeholder="Tu WhatsApp (opcional, ej. 0981...)" />
        <input type="text" id="orderNote" placeholder="Nota o detalle (ej. envolver para regalo)" />
        <button class="btn" id="sendWhatsAppBtn" type="button">Enviar a WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    const state = { settings:{}, seller:null, categories:[], tags:[], products:[], selectedCategory:'', search:'', budget:'', recipient:'', occasion:'', age:'', cart:[] };
    const gs = (n) => 'Gs. ' + Number(n || 0).toLocaleString('es-PY');
    const effPrice = (p) => p.offer_price_gs != null ? Number(p.offer_price_gs) : Number(p.price_gs || 0);
    const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    async function loadCatalog() {
      const v = new URLSearchParams(location.search).get('v');
      const res = await fetch(v ? '/api/catalog?v=' + encodeURIComponent(v) : '/api/catalog');
      const data = await res.json();
      Object.assign(state, {
        settings: data.settings || {},
        seller: data.seller || null,
        categories: data.categories || [],
        tags: data.tags || [],
        products: data.products || []
      });
      const biz = state.settings?.business?.name || 'Catálogo Express PY';
      document.title = biz;
      document.getElementById('brandName').textContent = biz;
      document.getElementById('sellerPill').textContent = state.seller ? 'Asesor: ' + state.seller.name : 'WhatsApp directo';
      populateSelectors();
      renderCategories();
      renderProducts();
    }

    function populateSelectors() {
      const bSel = document.getElementById('budgetSelect');
      bSel.innerHTML = '<option value="">Cualquier presupuesto</option>';
      (state.settings?.selector?.budget_ranges || []).forEach(([min, max], i) => {
        const o = document.createElement('option');
        o.value = String(i);
        o.textContent = max == null ? 'Más de ' + gs(min) : gs(min) + ' – ' + gs(max);
        bSel.appendChild(o);
      });
      const fill = (id, grp, def) => {
        const el = document.getElementById(id);
        el.innerHTML = '<option value="">' + def + '</option>';
        state.tags.filter((t) => t.group_key === grp).forEach((t) => {
          const o = document.createElement('option');
          o.value = String(t.id);
          o.textContent = t.label;
          el.appendChild(o);
        });
      };
      fill('recipientSelect', 'recipient', '¿Para quién?');
      fill('occasionSelect', 'occasion', '¿Qué ocasión?');
      fill('ageSelect', 'age', 'Edad');
    }

    function renderCategories() {
      const box = document.getElementById('categoryChips');
      box.innerHTML = '';
      const addChip = (label, val) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (state.selectedCategory === val ? ' active' : '');
        b.textContent = label;
        b.onclick = () => { state.selectedCategory = val; renderCategories(); renderProducts(); };
        box.appendChild(b);
      };
      addChip('Todos', '');
      state.categories.forEach((c) => addChip(c.name, String(c.id)));
    }

    function getFiltered() {
      const ranges = state.settings?.selector?.budget_ranges || [];
      const range = state.budget !== '' ? ranges[Number(state.budget)] : null;
      const tagIds = [state.recipient, state.occasion, state.age].filter(Boolean).map(Number);
      const q = state.search.trim().toLowerCase();
      return state.products.filter((p) => {
        if (state.selectedCategory && String(p.category_id) !== state.selectedCategory) return false;
        if (q && !(p.name + ' ' + (p.description || '')).toLowerCase().includes(q)) return false;
        const price = effPrice(p);
        if (range) {
          if (range[0] != null && price < range[0]) return false;
          if (range[1] != null && price > range[1]) return false;
        }
        if (tagIds.length && !tagIds.every((id) => (p.tag_ids || []).includes(id))) return false;
        return true;
      });
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const list = getFiltered();
      if (!list.length) {
        grid.innerHTML = '<div class="empty">No hay productos cargados aún o no coinciden con el filtro.</div>';
        return;
      }
      grid.innerHTML = '';
      list.forEach((p) => {
        const hasOffer = p.offer_price_gs != null && Number(p.offer_price_gs) < Number(p.price_gs);
        const img = p.image_ids && p.image_ids.length ? '/api/image/' + p.image_ids[0] : '';
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = '<div><div class="thumb">' +
          (hasOffer ? '<span class="badge-offer">OFERTA</span>' : '') +
          (img ? '<img src="' + img + '" alt="' + esc(p.name) + '" loading="lazy" />' : 'Sin foto') +
          '</div><div class="card-body"><div class="prod-name">' + esc(p.name) + '</div>' +
          '<div class="prod-desc">' + esc(p.description || '') + '</div>' +
          '<div class="price-row"><span class="price">' + gs(effPrice(p)) + '</span>' +
          (hasOffer ? '<span class="price-old">' + gs(p.price_gs) + '</span>' : '') +
          '</div></div></div><div class="card-body" style="padding-top:0;"><button class="btn" type="button">Agregar</button></div>';
        card.querySelector('button').onclick = () => addToCart(p);
        grid.appendChild(card);
      });
    }

    function addToCart(p) {
      const item = state.cart.find((i) => i.product_id === p.id);
      if (item) item.qty += 1;
      else state.cart.push({ product_id:p.id, product_name:p.name, qty:1, unit_price_gs:effPrice(p) });
      renderCartBar();
    }

    function renderCartBar() {
      const bar = document.getElementById('cartBar');
      const qty = state.cart.reduce((a, b) => a + b.qty, 0);
      const tot = state.cart.reduce((a, b) => a + b.qty * b.unit_price_gs, 0);
      bar.classList.toggle('visible', qty > 0);
      document.getElementById('cartCount').textContent = qty + (qty === 1 ? ' producto' : ' productos');
      document.getElementById('cartTotal').textContent = gs(tot);
    }

    function openModal() {
      const box = document.getElementById('cartItemsList');
      box.innerHTML = '';
      state.cart.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = '<div><strong>' + esc(it.product_name) + '</strong><br /><small>' + it.qty + ' x ' + gs(it.unit_price_gs) + '</small></div><button class="btn btn-ghost" type="button">Quitar</button>';
        row.querySelector('button').onclick = () => {
          state.cart.splice(idx, 1);
          renderCartBar();
          state.cart.length ? openModal() : closeModal();
        };
        box.appendChild(row);
      });
      document.getElementById('checkoutModal').classList.add('open');
    }

    const closeModal = () => document.getElementById('checkoutModal').classList.remove('open');

    async function sendWhatsApp() {
      if (!state.cart.length) return;
      const ref = 'PY-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      const customer_name = document.getElementById('customerName').value.trim();
      const customer_phone = document.getElementById('customerPhone').value.trim();
      const note = document.getElementById('orderNote').value.trim();
      try {
        await fetch('/api/leads', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ ref, seller_id:state.seller?.id || null, customer_name, customer_phone, note, items:state.cart })
        });
      } catch {}
      const phone = (state.seller?.phone || state.settings?.business?.default_phone || '595994354894').replace(/\D/g, '');
      const tot = state.cart.reduce((a, b) => a + b.qty * b.unit_price_gs, 0);
      const lines = [
        'Hola! Quiero consultar por este pedido (Ref: ' + ref + '):',
        ...state.cart.map((i) => '- ' + i.qty + 'x ' + i.product_name + ' (' + gs(i.qty * i.unit_price_gs) + ')'),
        'Total estimado: ' + gs(tot)
      ];
      if (customer_name) lines.push('Nombre: ' + customer_name);
      if (note) lines.push('Nota: ' + note);
      window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(lines.join('\n')), '_blank', 'noopener');
    }

    ['searchInput','budgetSelect','recipientSelect','occasionSelect','ageSelect'].forEach((id) => {
      document.getElementById(id).oninput = document.getElementById(id).onchange = (e) => {
        const map = { searchInput:'search', budgetSelect:'budget', recipientSelect:'recipient', occasionSelect:'occasion', ageSelect:'age' };
        state[map[id]] = e.target.value;
        renderProducts();
      };
    });

    document.getElementById('clearFiltersBtn').onclick = () => {
      Object.assign(state, { selectedCategory:'', search:'', budget:'', recipient:'', occasion:'', age:'' });
      ['searchInput','budgetSelect','recipientSelect','occasionSelect','ageSelect'].forEach((id) => { document.getElementById(id).value = ''; });
      renderCategories();
      renderProducts();
    };
    document.getElementById('openCheckoutBtn').onclick = openModal;
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('sendWhatsAppBtn').onclick = sendWhatsApp;

    loadCatalog();
  </script>
</body>
</html>
